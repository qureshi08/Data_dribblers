<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Dribblers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design spec: design/DESIGN.md. References: design/references (Veo Analytics 2, Veo Editor, Soccerment Atlas). */
:root{--ground:#121812;--surface:#1A211A;--raised:#242C24;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--text:#F3F4EF;--muted:#98A096;--dim:#646C63;--live:#C7F04B;--good:#4ED17E;--warn:#F2B33D;--bad:#F2555A;
--sans:'Schibsted Grotesk',system-ui,sans-serif;--num:'Archivo',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:1480px;margin:0 auto;padding:16px 20px 40px}
.nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 20px;background:#0C110C;border-radius:999px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:8px;font:600 18px var(--sans);letter-spacing:-.02em}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 12px rgba(199,240,75,.6)}
.nav .r{display:flex;gap:8px}
.pill{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.pill:hover{background:var(--raised)}
.pill.w{background:var(--text);color:#0C110C;border-color:var(--text);font-weight:600}
.pill.w:hover{background:#fff}
.label{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#0C110C;border-radius:28px;padding:18px 28px;margin-bottom:18px}
.match .tm{display:flex;align-items:center;gap:14px;font:500 20px var(--sans);letter-spacing:-.01em}
.match .tm.r{justify-content:flex-end}
.match .dot{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.match .sc{font:700 44px/1 var(--num);font-stretch:75%;font-variant-numeric:tabular-nums;margin:0 18px}
.match .mid{display:flex;align-items:center}
.match .meta{text-align:center;font:500 12px var(--sans);color:var(--muted);line-height:1.4}
.match .meta b{display:block;color:var(--text);font-weight:600;font-size:13px}
@media(max-width:700px){.match{padding:14px 16px}.match .tm{font-size:15px;gap:8px}.match .dot{width:20px;height:20px}.match .sc{font-size:32px;margin:0 8px}.match .meta{display:none}.nav .pill:not(.w){display:none}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:18px;align-items:start}
@media(max-width:1100px){.main{grid-template-columns:minmax(0,1fr)}}
.player{background:#0C110C;border-radius:28px;padding:10px;position:sticky;top:12px}
@media(max-width:1100px){.player{position:static}}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:16/9;cursor:pointer}
.stage video,.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:8px;background:rgba(12,17,12,.72);backdrop-filter:blur(8px);border-radius:999px;padding:7px 12px 7px 10px;font:500 12px var(--sans);pointer-events:none}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--live)}
.hint{position:absolute;right:14px;bottom:14px;background:rgba(12,17,12,.72);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font:500 12px var(--sans);color:var(--muted);pointer-events:none;transition:opacity .4s}
.tl{height:40px;margin:12px 6px 4px;cursor:pointer;position:relative}
.tl canvas{width:100%;height:100%;display:block}
.ctrl{display:flex;align-items:center;gap:6px;padding:4px 6px 6px;flex-wrap:wrap}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--raised);color:var(--text)}
.ib svg{width:18px;height:18px}
.ib.main{background:var(--text);color:#0C110C;width:44px;height:44px}
.ib.main svg{width:20px;height:20px}
.time{font:500 13px var(--num);font-stretch:85%;font-variant-numeric:tabular-nums;color:var(--muted);margin:0 8px}
.sp{flex:1}
.sw{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--raised);border:0;cursor:pointer;font:500 12.5px var(--sans);color:var(--text)}
.sw b{width:30px;height:18px;border-radius:9px;background:#3A433A;position:relative;transition:background .2s}
.sw b:after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#C9CEC6;transition:transform .2s}
.sw.on b{background:var(--live)}.sw.on b:after{transform:translateX(12px);background:#0C110C}
.menu{position:relative}
.pop{position:absolute;right:0;bottom:44px;width:230px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:8px;display:none;z-index:5;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.pop.open{display:block}
.pop label{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:10px;cursor:pointer;font:500 13px var(--sans)}
.pop label:hover{background:var(--raised)}
.pop input{accent-color:#C7F04B;width:16px;height:16px}
.panel{background:var(--surface);border-radius:28px;padding:8px;min-height:640px}
.tabs{display:flex;gap:4px;background:#0C110C;border-radius:999px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;height:38px;border:0;border-radius:999px;background:transparent;cursor:pointer;font:500 13.5px var(--sans);color:var(--muted)}
.tabs button.on{background:var(--raised);color:var(--text)}
.view{padding:14px 12px 10px}
.view h2{font:500 22px/1.2 var(--sans);letter-spacing:-.02em;margin:6px 0 4px}
.view p.sub{color:var(--muted);margin:0 0 18px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px 10px;padding:11px 0;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0}
.cmp .v{font:600 20px var(--num);font-stretch:80%;font-variant-numeric:tabular-nums}
.cmp .v.r{text-align:right}
.cmp .k{font:500 12.5px var(--sans);color:var(--muted);text-align:center;min-width:140px}
.cmp .bar{grid-column:1/-1;display:flex;gap:3px;height:3px}
.cmp .bar i{display:block;height:100%;border-radius:2px}
.box{background:#0F150F;border-radius:20px;padding:14px;margin-top:14px}
.ev{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:12px}
.ev:first-of-type{border-top:0}
.ev:hover{background:var(--raised)}
.ev.now{background:rgba(199,240,75,.08)}
.ev .t{font:600 13px var(--num);font-stretch:85%;color:var(--muted);font-variant-numeric:tabular-nums}
.ev b{display:block;font:500 13.5px var(--sans)}
.ev span{font:400 12px var(--sans);color:var(--muted)}
.play{height:30px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--text);color:#0C110C;font:600 12px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.play.off{background:#2C342C;color:#6E766D;cursor:default}
.play svg{width:10px;height:10px}
.flow{display:flex;gap:2px;height:34px;margin-top:10px}
.flow i{flex:1;border-radius:3px;display:flex;flex-direction:column;overflow:hidden;gap:1px}
.flow i span{display:block}
.pc{background:#0F150F;border-radius:22px;padding:16px;margin-bottom:12px}
.pc .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pc .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--num);font-stretch:85%;color:#0C110C;flex:none}
.pc .hd b{display:block;font:500 15px var(--sans)}
.pc .hd span{font:400 12px var(--sans);color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row span{color:var(--muted);font-size:13px}
.row b{font:600 15px var(--num);font-stretch:85%;font-variant-numeric:tabular-nums}
.pc .ft{display:flex;justify-content:center;margin-top:8px}
.pl{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;gap:12px;padding:9px 8px;border-radius:14px;cursor:pointer}
.pl:hover{background:var(--raised)}
.pl .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--num);font-stretch:85%;color:#0C110C}
.pl b{font:500 14px var(--sans)}.pl span{color:var(--muted);font-size:12px;display:block}
.pl em{font:600 15px var(--num);font-stretch:85%;font-style:normal;font-variant-numeric:tabular-nums}
.pl i{color:var(--dim);font-style:normal}
.back{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 0 10px;font:500 13px var(--sans)}
.vis{background:#0F150F;border-radius:22px;padding:14px;margin-bottom:12px}
.vis .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;background:#0C110C;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);height:26px;padding:0 10px;border-radius:999px;cursor:pointer;font:500 12px var(--sans)}
.seg button.on{background:var(--raised);color:var(--text)}
.vis p{color:var(--muted);font-size:12.5px;margin:10px 2px 0}
svg.pitch{display:block;width:100%;height:auto}
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px}
.bub{max-width:90%;padding:11px 14px;border-radius:18px;font-size:13.5px}
.bub.q{align-self:flex-end;background:var(--text);color:#0C110C;border-bottom-right-radius:6px;font-weight:500}
.bub.a{align-self:flex-start;background:#0F150F;border-bottom-left-radius:6px}
.asks{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.asks button{border:1px solid var(--line2);background:transparent;border-radius:999px;height:34px;padding:0 14px;cursor:pointer;font:500 12.5px var(--sans);color:var(--text)}
.asks button:hover{background:var(--raised)}
.note{color:var(--dim);font-size:12px;margin-top:14px}
@media print{.nav,.player,.tabs,.asks{display:none!important}.main{display:block}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav"><a class="logo" href="/" style="color:inherit;text-decoration:none"><i></i>Data Dribblers</a><div class="r"><a class="pill" href="/" style="color:inherit;text-decoration:none">Upload a match</a><button class="pill" id="share">Copy link</button><button class="pill w" onclick="window.print()">Download report</button></div></nav>
  <div class="match" id="matchbar"></div>
  <div class="main">
    <div class="player">
      <div class="stage" id="stage">
        <div id="cam" style="position:absolute;inset:0;transform-origin:0 0"><video id="vid" muted playsinline preload="auto"></video><canvas id="ov"></canvas></div>
        <canvas id="draw" style="pointer-events:none"></canvas>
        <div class="chip"><i></i><span id="chiptxt">AI tracking</span></div>
        <div class="hint" id="hint">Tap a player to follow their numbers</div>
      </div>
      <div class="tl" id="tl"><canvas id="tlc"></canvas></div>
      <div class="ctrl">
        <button class="ib main" id="play" aria-label="Play"></button>
        <button class="ib" id="prev" aria-label="Previous moment" title="Previous moment"></button>
        <button class="ib" id="back5" aria-label="Back 5 seconds" title="Back 5 seconds"></button>
        <button class="ib" id="fwd5" aria-label="Forward 5 seconds" title="Forward 5 seconds"></button>
        <button class="ib" id="next" aria-label="Next moment" title="Next moment"></button>
        <span class="time" id="time">00:00 / 00:00</span>
        <span class="sp"></span>
        <button class="sw" id="follow">Follow ball <b></b></button>
        <button class="sw" id="speedrun">Key moments only <b></b></button>
        <div class="menu"><button class="ib" id="layersBtn" aria-label="Layers" title="Layers"></button><div class="pop" id="layers"></div></div>
        <button class="ib" id="drawBtn" aria-label="Draw" title="Draw on the video"></button>
      </div>
    </div>
    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="view" id="view"></div>
    </div>
  </div>
</div>
<script>
const D = /*DATA*/null;
const m = D.meta, T = D.teams, L = D.live, FR = D.frames, ROLE = D.roles, A = D.adv;
const [VW, VH] = D.video_size, [PL, PW] = m.pitch;
const MAPPED = m.pitch_mapped > 30;   // pitch features only where the camera is really mapped
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>',
  fwd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5zM3 12l9 5 9-5M3 16.5l9 5 9-5"/></svg>',
  draw: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>',
  tri: '<svg viewBox="0 0 10 10" fill="currentColor"><path d="M2 1v8l7-4z"/></svg>',
};
// shirt colours under floodlights come out muddy: snap to clean values, white stays white
function snap(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn, s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  let h = 0; if (d) h = (mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60; h = (h + 360) % 360;
  if ((s < .18 && l > .45) || (s < .4 && l > .68)) return '#EDEFEA';
  if (s < .18) return '#7D8794';
  if (h < 40 || h >= 330) return '#E5484D'; if (h < 70) return '#F2C94C'; if (h < 165) return '#46C37B'; if (h < 200) return '#3FB8E0'; if (h < 270) return '#5B7CFA'; return '#9B6CF2';
}
const TC = T.map(t => snap(t.colour));
if (TC[0] === TC[1]) TC[1] = TC[0] === '#EDEFEA' ? '#E5484D' : '#EDEFEA';   // two kits that snap to one colour would look like one team
const LIVE = '#C7F04B', GOOD = '#4ED17E', WARN = '#F2B33D', BAD = '#F2555A';

/* moments: what deserves a clip */
const PX = A ? A.passes : D.passes.map(() => null);
const MOMENTS = [
  ...D.shots.map(x => ({ t: x.t, kind: x.goal ? 'Goal' : 'Shot', who: `${T[x.team].name} · xG ${x.xg}` })),
  ...D.passes.map((q, k) => ({ q, x: PX[k] })).filter(o => o.q.ok && ((o.x && o.x.packing >= 2) || o.q.progressive))
    .map(o => ({ t: o.q.t, kind: o.x && o.x.packing >= 2 ? 'Line breaking pass' : 'Forward pass', who: `${T[o.q.team].name} · #${o.q.from} to #${o.q.to}${o.x && o.x.packing >= 2 ? ` · beat ${o.x.packing}` : ''}` })),
  ...D.turnovers.map(x => ({ t: x.t, kind: 'Ball won', who: T[x.won_by].name })),
  ...D.passes.filter(q => !q.ok).map(q => ({ t: q.t, kind: 'Pass lost', who: `${T[q.team].name} · #${q.from}` })),
].sort((a, b) => a.t - b.t);

const $ = id => document.getElementById(id);
const goals = [0, 1].map(k => D.shots.filter(s => s.team === k && s.goal).length);
$('matchbar').innerHTML = `
  <div class="tm"><span class="dot" style="background:${TC[0]}"></span>${T[0].name}</div>
  <div class="mid"><span class="sc">${goals[0]}</span><div class="meta"><b>${D.match.event}</b>${D.match.date} · ${fmt(m.duration_s)} analysed</div><span class="sc">${goals[1]}</span></div>
  <div class="tm r">${T[1].name}<span class="dot" style="background:${TC[1]}"></span></div>`;

/* video and controls */
const vid = $('vid'); vid.src = D.video;
const ov = $('ov'), ctx = ov.getContext('2d'), DPR = +new URLSearchParams(location.search).get('dpr') || Math.min(2, devicePixelRatio || 1);   // ?dpr=3 draws the overlay finer (the promo film zooms into it)
const T0 = FR[0][0], T1 = FR[FR.length - 1][0];
vid.addEventListener('loadedmetadata', () => { if (T0 > .5 && vid.currentTime < T0) vid.currentTime = T0; }, { once: true });   // open on the analysed part when the match starts later in the video
$('play').innerHTML = ICON.play; $('prev').innerHTML = ICON.prev; $('next').innerHTML = ICON.next; $('back5').innerHTML = ICON.back; $('fwd5').innerHTML = ICON.fwd;
$('layersBtn').innerHTML = ICON.layers; $('drawBtn').innerHTML = ICON.draw;
const opts = { rings: true, ids: true, trail: true, pc: false, options: false, lines: false, shape: false, radar: MAPPED, follow: false, speedrun: false };   // tactical layers start off: all three at once buried the picture; they are one click away in Layers
const LAYERS = [['rings', 'Player rings', 1], ['ids', 'Track numbers', 1], ['trail', 'Ball trail', 1], ['pc', 'Pitch control', MAPPED && A], ['options', 'Pass options', MAPPED && A],
  ['lines', 'Defensive lines', MAPPED && A], ['shape', 'Team shape', MAPPED && A], ['radar', 'Mini radar', MAPPED]].filter(l => l[2]);
$('layers').innerHTML = LAYERS.map(([k, l]) => `<label>${l}<input type="checkbox" data-k="${k}" ${opts[k] ? 'checked' : ''}></label>`).join('');
$('layers').onchange = e => { opts[e.target.dataset.k] = e.target.checked; };
$('layersBtn').onclick = e => { e.stopPropagation(); $('layers').classList.toggle('open'); };
document.addEventListener('click', e => { if (!e.target.closest('.menu')) $('layers').classList.remove('open'); });
const sw = (id, k) => { $(id).onclick = () => { opts[k] = !opts[k]; $(id).classList.toggle('on', opts[k]); if (k === 'speedrun' && opts[k] && MOMENTS.length) seekMoment(0); }; };
sw('follow', 'follow'); sw('speedrun', 'speedrun');
$('play').onclick = () => vid.paused ? vid.play() : vid.pause();
vid.onplay = () => { $('play').innerHTML = ICON.pause; }; vid.onpause = () => { $('play').innerHTML = ICON.play; };
$('back5').onclick = () => { vid.currentTime = Math.max(0, vid.currentTime - 5); };
$('fwd5').onclick = () => { vid.currentTime = Math.min(vid.duration || T1, vid.currentTime + 5); };
function seekMoment(i) { const mo = MOMENTS[i]; if (!mo) return; vid.currentTime = Math.max(0, mo.t - 1.5); vid.play(); }
$('next').onclick = () => { const i = MOMENTS.findIndex(mo => mo.t - 1.5 > vid.currentTime + .2); if (i >= 0) seekMoment(i); };
$('prev').onclick = () => { let i = -1; MOMENTS.forEach((mo, k) => { if (mo.t - 1.5 < vid.currentTime - 1) i = k; }); if (i >= 0) seekMoment(i); };
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').onclick(); } });
$('share').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(location.href); $('share').textContent = 'Link copied'; setTimeout(() => $('share').textContent = 'Copy link', 1600); };
function jump(t) { vid.currentTime = Math.max(0, t - 1.5); vid.play(); }

/* tracking helpers */
function idxAt(t) { let lo = 0, hi = FR.length - 1; if (t <= FR[0][0]) return 0; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (FR[mid][0] <= t) lo = mid; else hi = mid - 1; } return lo; }
function holder(i) {
  if (A) return A.live.holder[i];
  const b = FR[i][2], k = L.poss[i]; if (!b || k == null) return null;
  let best = null, bd = 1e9;
  for (const p of FR[i][1]) { const r = ROLE[p[0]]; if (!r || r[0] !== k) continue; const d = Math.hypot((p[1] + p[3]) / 2 - b[0], p[4] - b[1]); if (d < bd && d < (p[4] - p[2]) * .9) { bd = d; best = p[0]; } }
  return best;
}
const SERIES = {};

  return `<svg class="pitch" viewBox="-2 -2 ${PL + 4} ${PW + 4}"><rect x="-2" y="-2" width="${PL + 4}" height="${PW + 4}" rx="4" fill="#0B100B"/>${inner}
    <rect x="0" y="0" width="${PL}" height="${PW}" rx="2" ${ln}/><line x1="${PL / 2}" y1="0" x2="${PL / 2}" y2="${PW}" ${ln}/><circle cx="${PL / 2}" cy="${PW / 2}" r="${big ? 9.15 : 3}" ${ln}/>
    ${big ? box(0, 40.32, 16.5) + box(PL - 16.5, 40.32, 16.5) + box(0, 18.32, 5.5) + box(PL - 5.5, 18.32, 5.5) : ''}</svg>`;
}
const VIS = { net: 0, heat: 0 };
function visCard(id, title, text) {
  const seg = ['net', 'heat'].includes(id) ? `<div class="seg">${[0, 1].map(k => `<button class="${VIS[id] === k ? 'on' : ''}" onclick="VIS.${id}=${k};show('Tactics')">${T[k].name}</button>`).join('')}</div>` : '';
  return `<div class="vis"><div class="hd"><span class="label" style="color:var(--text)">${title}</span>${seg}</div><div id="vis_${id}"></div><p>${text}</p></div>`;
}
function heatColour(v) { const st = [[78, 209, 126], [242, 201, 76], [242, 140, 58], [229, 72, 77]], x = Math.min(.999, v) * 3, i = Math.floor(x), f = x - i; return `rgb(${st[i].map((c, k) => Math.round(c + (st[i + 1][k] - c) * f)).join(',')})`; }
function drawVis() {
  const net = D.network[VIS.net], by = Object.fromEntries(net.nodes.map(n => [n.id, n])), mx = Math.max(1, ...net.edges.map(e => e.n));
  if ($('vis_net')) $('vis_net').innerHTML = pitchSvg(net.edges.map(e => { const a = by[e.a], b = by[e.b]; return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#E5484D" stroke-opacity=".85" stroke-width="${.25 + 1.4 * e.n / mx}" stroke-linecap="round"/>`; }).join('')
    + net.nodes.map(n => `<circle cx="${n.x}" cy="${n.y}" r="${PL > 60 ? 2.8 : 1.3}" fill="#F3F4EF"/><text x="${n.x}" y="${n.y + (PL > 60 ? .8 : .4)}" font-size="${PL > 60 ? 2.3 : 1.1}" font-weight="700" text-anchor="middle" fill="#0C110C" font-family="Archivo">${n.id}</text>`).join(''));
  const grid = D.heat['team' + VIS.heat], [gx, gy] = m.grid, cw = PL / gx, ch = PW / gy;
  if ($('vis_heat')) $('vis_heat').innerHTML = pitchSvg(`<defs><filter id="bl"><feGaussianBlur stdDeviation="1.6"/></filter></defs><g filter="url(#bl)">${grid.map((row, j) => row.map((v, i) => v > .04 ? `<rect x="${i * cw}" y="${j * ch}" width="${cw + .1}" height="${ch + .1}" fill="${heatColour(v)}" fill-opacity="${Math.min(.95, .25 + v)}"/>` : '').join('')).join('')}</g>`);
  if (A && $('vis_pc')) { const g = A.pc.avg[0], [px, py] = A.pc.grid; $('vis_pc').innerHTML = pitchSvg('<defs><filter id="bl2"><feGaussianBlur stdDeviation="1.2"/></filter></defs><g filter="url(#bl2)">' + g.map((row, r) => row.map((v, c) => v < 0 ? '' : `<rect x="${c * PL / px}" y="${r * PW / py}" width="${PL / px + .05}" height="${PW / py + .05}" fill="${TC[v >= .5 ? 0 : 1]}" fill-opacity="${(Math.abs(v - .5) * 1.4).toFixed(2)}"/>`).join('')).join('') + '</g>'); }
  if ($('vis_shots')) $('vis_shots').innerHTML = pitchSvg(D.shots.map(s => { const x = s.team === 0 ? s.x : PL - s.x, y = s.team === 0 ? s.y : PW - s.y; return `<circle cx="${x}" cy="${y}" r="${1 + Math.sqrt(s.xg) * 4}" fill="${s.goal ? LIVE : 'none'}" stroke="${TC[s.team]}" stroke-width=".4" onclick="jump(${s.t})" style="cursor:pointer"/>`; }).join(''));
}
const VIEWS = {
  Overview() {
    const rows = [cmpRow('Possession', T[0].possession, T[1].possession, '%'), cmpRow('Passes completed', T[0].completed, T[1].completed), cmpRow('Pass accuracy', T[0].accuracy, T[1].accuracy, '%')];
    if (A) rows.push(cmpRow('Opponents bypassed by passes', A.teams[0].packing, A.teams[1].packing), cmpRow('Line breaking passes', A.teams[0].line_breaking, A.teams[1].line_breaking));
    rows.push(cmpRow('Ball wins', T[0].turnovers_won, T[1].turnovers_won));
    if (D.shots.length) rows.push(cmpRow('Shots', T[0].shots, T[1].shots), cmpRow('Expected goals', T[0].xg, T[1].xg, '', 2));
    if (MAPPED) rows.push(cmpRow('Distance covered', T[0].distance_km, T[1].distance_km, ' km', 2));
    return `<div class="label">01 · Overview</div><h2>How the match went</h2><p class="sub">Tap any moment to watch it.</p>
      <div class="box">${rows.join('')}</div>
      <div class="box"><div class="label" style="margin-bottom:6px">Key moments · ${MOMENTS.length}</div>
      ${MOMENTS.length ? MOMENTS.map((mo, k) => `<div class="ev" data-k="${k}" onclick="jump(${mo.t})"><div class="t">${fmt(mo.t)}</div><div><b>${mo.kind}</b><span>${mo.who}</span></div>${playBtn(mo.t)}</div>`).join('') : '<div class="note">No key moments in this video.</div>'}</div>
      <div class="box"><div class="label">Who had the ball</div><div class="flow">${D.timeline.map(v => v == null ? '<i style="background:#262E26"></i>' : `<i><span style="flex:${v};background:${TC[0]}"></span><span style="flex:${1 - v};background:${TC[1]}"></span></i>`).join('')}</div>
      <div class="note" style="margin-top:8px;display:flex;justify-content:space-between"><span>Start</span><span>${fmt(m.duration_s)}</span></div></div>`;
  },
  Players() {
    const list = D.players.filter(p => p.minutes >= Math.min(.25, m.duration_s / 200)).slice(0, 20);
    const key = MAPPED ? p => p.distance_m + ' m' : p => D.passes.filter(q => q.from === p.id || q.to === p.id).length + ' touches';
    return `<div class="label">02 · Players</div><h2>Every player, tracked</h2><p class="sub">From the video you already have. No vests, no tagging. Tap a player for their card.</p>
      <div class="box" style="padding:6px">${list.map(p => `<div class="pl" onclick="openPlayer(${p.id})"><div class="av" style="background:${TC[p.team]}">${p.id}</div><div><b>Track #${p.id}${p.role === 'goalkeeper' ? ' · Keeper' : ''}</b><span>${T[p.team].name} · ${p.minutes.toFixed(1)} min tracked</span></div><em>${key(p)}</em><i>›</i></div>`).join('')}</div>`;
  },
  Tactics() {
    return `<div class="label">03 · Tactics</div><h2>Why it went that way</h2><p class="sub">Space, shape and passing, drawn on the pitch.</p>
      ${visCard('net', 'Passing network', 'Who found whom. Line weight is passes between the pair.')}${visCard('heat', 'Heat map', 'Where each team spent its time.')}
      ${A ? visCard('pc', 'Pitch control', 'The space each team owned, averaged over every moment the camera saw it.') : ''}${D.shots.length ? visCard('shots', 'Shot map', 'Where each shot came from. Size is xG.') : ''}`;
  },
  Ask() {
    return `<div class="label">${MAPPED ? '04' : '03'} · Ask</div><h2>Ask the match</h2><p class="sub">Every answer is worked out from this match's tracking data.</p>
      <div class="chat" id="chat"><div class="bub a">Pick a question below.</div></div>
      <div class="asks">${Object.keys(ASKS).map(q => `<button onclick="ask(this.textContent)">${q}</button>`).join('')}</div>`;
  },
};
const TABS = ['Overview', 'Players', ...(MAPPED ? ['Tactics'] : []), 'Ask'];
function show(name) { $('tabs').innerHTML = TABS.map(n => `<button class="${n === name ? 'on' : ''}" onclick="show('${n}')">${n}</button>`).join(''); view.innerHTML = VIEWS[name](); if (name === 'Tactics') drawVis(); }

/* loop */
let lastNow = -2;
function frame() {
  const t = vid.currentTime || 0;
  drawOverlay(t); drawTimeline(t);
  $('time').textContent = `${fmt(t)} / ${fmt(vid.duration || T1)}`;
  if (opts.speedrun && !vid.paused && !MOMENTS.some(mo => t >= mo.t - 1.6 && t <= mo.t + 2.5)) { const nx = MOMENTS.findIndex(mo => mo.t - 1.5 > t); if (nx >= 0) vid.currentTime = MOMENTS[nx].t - 1.5; else vid.pause(); }
  const now = MOMENTS.findIndex(mo => t >= mo.t - 1 && t <= mo.t + 2.5);
  if (now !== lastNow) { lastNow = now; document.querySelectorAll('.ev').forEach(e => e.classList.toggle('now', +e.dataset.k === now)); }
  requestAnimationFrame(frame);
}
$('chiptxt').textContent = MAPPED ? 'AI tracking · pitch mapped' : 'AI tracking';
show('Overview');
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
